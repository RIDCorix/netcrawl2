name: Test Suite Watchdog

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-master-test-run:
    name: Verify master test run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Require an active, completed test run for master HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-test-workflow.mjs
